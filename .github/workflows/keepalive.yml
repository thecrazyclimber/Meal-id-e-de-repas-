# Envoie une petite requête à Supabase le lundi et le jeudi pour éviter la mise en pause (plan gratuit).
# Prérequis : fonction ping() dans la base (voir setup.sql) + secrets GitHub SUPABASE_URL et SUPABASE_ANON_KEY.
name: supabase-keepalive
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
